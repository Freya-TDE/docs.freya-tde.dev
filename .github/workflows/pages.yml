# docs.freya-tde.dev bauen und auf GitHub Pages veröffentlichen.
# Holt die Doku aus Freya-TDE, RUF und CT-E (tools/build.py). Läuft bei Änderungen hier,
# von Hand, wenn ein Programm-Repo „docs“ meldet (repository_dispatch), und täglich, damit
# Doku-Änderungen in den Programm-Repos ohne Token ankommen.
# Build docs.freya-tde.dev and publish it on GitHub Pages (also daily, to pick up doc changes).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    # Erst wenn das Repository öffentlich ist (Pages bei kostenlosen Organisationen).
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Freya-TDE/Freya-TDE
          path: sources/Freya-TDE
      - uses: actions/checkout@v7
        with:
          repository: Freya-TDE/RUF
          path: sources/RUF
      - uses: actions/checkout@v7
        with:
          repository: Freya-TDE/CT-E
          path: sources/CT-E
      - name: mdBook
        run: |
          curl -sSLf "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin mdbook
          mdbook --version
      - name: Bauen
        run: python3 tools/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
