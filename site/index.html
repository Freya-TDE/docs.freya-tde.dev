<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freya TDE – Dokumentation / Documentation</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="color-scheme" content="light dark">
  <script>
    // Sprache des Browsers: Deutsch → /de/, sonst /en/.
    (function () {
      var langs = navigator.languages || [navigator.language || "en"];
      var de = langs.some(function (l) { return /^de\b/i.test(l); });
      location.replace(de ? "de/" : "en/");
    })();
  </script>
  <style>
    :root { --bg: #f5f5f5; --fg: #000; --stroke: transparent; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #232323; --fg: #f2f2f2; --stroke: #f2f2f2; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1 { color: #990000; -webkit-text-stroke: 1.6px var(--stroke); paint-order: stroke fill; }
    a { color: inherit; text-decoration-color: #990000; margin: 0 0.6em; font-size: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Freya TDE</h1>
    <p><a href="de/" hreflang="de">Deutsch</a> · <a href="en/" hreflang="en">English</a></p>
  </main>
</body>
</html>
